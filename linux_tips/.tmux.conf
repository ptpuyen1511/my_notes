# Set default shell
set -g default-terminal "xterm-256color"
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# Use mouse
set -g mouse on

# Set history limit
set -g history-limit 50000

# Set the prefix to Ctrl+a
set -g prefix C-a
set -g prefix2 C-b

# Send Ctrl+a to applications by pressing it twice
bind C-a send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set -g status-left-length 30

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Set mode keys to vim
setw -g mode-keys vi
set -sg escape-time 10
bind-key -T copy-mode-vi v send-keys -X begin-selection # Vim-style initiating selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel # Vim-style copying

# Fast config reloading
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Show hint when pressing prefix
set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

# Make pane navigation with hjkl repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with Prefix + Shift + h/j/k/l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins (via tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure the Catppuccin plugin to show window names instead of directory
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# --- For session saving ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'    # Automatically restore last saved environment when tmux starts
set -g @resurrect-strategy-nvim 'session' # Optional: Restore Neovim sessions if using Session.vim

# Initialize TMUX plugin manager (Keep this line at the very bottom!)
run '~/.tmux/plugins/tpm/tpm'
